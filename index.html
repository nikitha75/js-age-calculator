<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="./style.css" type="text/css">
</head>
<body>
    <div class="ag-container">
        <div class="container">
            <label for="dob">Your Date of Birth</label>
            <input type="date" name="dob-name" id="dob" >
            <div class="result-container">
                <p class="desc">Your Age:</p>
                <p class="age">
                    <span id="years"></span> years
                    <span id="months"></span> months
                    <span id="days"></span> days
                </p>
                <p class="error">Welcome Time Traveller!</p>
            </div>
        </div>
        <div class="image-container">
            <img src="images/bday-img.png" class="bday-img" alt="birthday">
        </div>
    </div>
    <script src="./app.js" type="text/javascript"></script>
</body>
</html>
